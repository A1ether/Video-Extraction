[project]
name = "vextract"
version = "0.3.0"
description = "自媒体视频提取工具：分享链接/文本 → 无水印视频 + 元数据"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "yt-dlp>=2026.10.21",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "typer>=0.27",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "rich>=15.0",
    "lxml>=6",
]

[project.scripts]
vx = "vextract.cli:app"

[project.optional-dependencies]
# 本地转录是可选的：不装也能用视频/音频/图集，装了才能 --transcribe。
# 两者都是 MIT 许可（与项目依赖口径一致，见 README「许可证与合规」）。
transcribe = [
    "faster-whisper>=1.0.0",
    # faster-whisper 1.2.1 内部调用 av.open(..., metadata_errors="ignore")，
    # 而 av 19.0 起不再接受这个关键字 → 实跑必 TypeError（已实测 19.0.2 崩、18.1.0 正常）
    "av>=11,<19",
]
transcribe-mlx = ["mlx-whisper>=0.4.0; sys_platform == 'darwin'"]   # Apple Silicon 最快；连带 torch，实测 .venv 约 1.3GB

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# packages 已包含包目录下的全部文件（含 web/ 前端资源），不需要 force-include，
# 否则 hatchling 会因同一路径被添加两次而构建失败。
packages = ["src/vextract"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 测试里为了可读性常把构造写在一行
"tests/*" = ["E501"]
# typer 的声明式 Option/Argument 默认值就是这个写法
"src/vextract/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: 访问真实网络（默认不跑，用 -m live 显式开启）",
]
addopts = "-m 'not live'"
