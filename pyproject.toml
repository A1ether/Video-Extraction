[project]
name = "vextract"
version = "0.1.0"
description = "自媒体视频提取工具：分享链接/文本 → 无水印视频 + 元数据"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "yt-dlp>=2026.10.21",
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "typer>=0.27",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "rich>=15.0",
    "lxml>=6",
]

[project.scripts]
vx = "vextract.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "respx>=0.22",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# packages 已包含包目录下的全部文件（含 web/ 前端资源），不需要 force-include，
# 否则 hatchling 会因同一路径被添加两次而构建失败。
packages = ["src/vextract"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 测试里为了可读性常把构造写在一行
"tests/*" = ["E501"]
# typer 的声明式 Option/Argument 默认值就是这个写法
"src/vextract/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: 访问真实网络（默认不跑，用 -m live 显式开启）",
]
addopts = "-m 'not live'"
